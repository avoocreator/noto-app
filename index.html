<!doctype html>
<html lang="id" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF3E3" />
    <meta name="description" content="Noto — vault catatan Markdown dan canvas, lokal-first." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Noto</title>
    <script>
      // Terapkan mode sebelum React jalan supaya tidak ada kilatan putih/gelap.
      try {
        var s = JSON.parse(localStorage.getItem('noto-theme') || '{}').state || {};
        var m = s.mode || 'system';
        if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.mode = m;
        document.documentElement.style.background = m === 'dark' ? '#16130f' : '#faf3e3';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
