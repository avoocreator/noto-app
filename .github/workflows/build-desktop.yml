name: Build Desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-22.04, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run tauri build
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: noto-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/noto.exe
      - if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with: { name: noto-${{ matrix.os }}, path: src-tauri/target/release/bundle/** }
